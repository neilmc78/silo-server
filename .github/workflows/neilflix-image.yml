# Builds this fork's all-in-one image and pushes it to GitHub's container
# registry, so the LXC only pulls it. Runs on pushes to main and by hand from
# the Actions tab, where any branch can be picked.
name: NeilFlix image

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  issues: write # to report a failed build

concurrency:
  group: neilflix-image-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build date
        id: meta
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Silo image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:neilflix-base-${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_NUMBER=${{ github.run_number }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Build all-in-one image
        uses: docker/build-push-action@v6
        with:
          context: omnibus
          platforms: linux/amd64
          push: true
          build-args: |
            SILO_IMAGE=${{ env.IMAGE }}:neilflix-base-${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:neilflix
            ${{ env.IMAGE }}:neilflix-${{ github.sha }}
          cache-from: type=gha,scope=aio
          cache-to: type=gha,scope=aio,mode=max

      # Report a failed build on the daily-build issue, mentioning the owner so
      # GitHub notifies them; the daily build closes it after a clean run. A
      # run cancelled by a newer push is not a failure.
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf '@%s The NeilFlix image build failed on `%s`, so the image was not updated.\n\nRun: %s\n' "$OWNER" "${SHA:0:12}" "$RUN_URL")
          gh label create daily-build --color B60205 --description "Daily fork build is blocked" 2>/dev/null || true
          n=$(gh issue list --label daily-build --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "Daily build blocked" --label daily-build --body "$body"
          fi
